[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-exam-monitoring"
version = "0.1.0"
description = "Research/demo pipeline for observable behavior monitoring in exam-room video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3.0",
  "Pillow>=11,<13",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
classifier = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "psutil==7.0.0",
]
ml = [
  "opencv-python-headless>=4.10,<5",
  "torch>=2.5,<3",
  "ultralytics>=8.3,<9",
  "wandb>=0.19,<1",
]
dvc = [
  "dvc[gdrive]>=3.60,<4",
  # PyDrive2 caps pyOpenSSL at 24.2.1; older versions can resolve with an
  # incompatible cryptography version and fail during OAuth imports.
  "pyOpenSSL==24.2.1",
]
dev = [
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_exam_monitoring.data" = ["review_workspace_assets/*.html", "review_workspace_assets/*.css", "review_workspace_assets/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["ai_exam_monitoring"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torchvision.*"]
follow_untyped_imports = true
