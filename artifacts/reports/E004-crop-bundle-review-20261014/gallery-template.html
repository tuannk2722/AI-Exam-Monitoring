<!doctype html><html lang="vi"><meta charset="utf-8"><title>E004 — Review đối chiếu crop</title>
<style>body{font:16px system-ui;margin:24px;background:#f2f4f8;color:#192538}header{position:sticky;top:0;background:#fff;padding:16px;border-radius:10px;z-index:2}input,select,button{font:inherit;padding:8px;margin:4px}article{background:white;border-radius:10px;padding:20px;margin:18px 0}h2{margin:0 0 8px}.images{display:flex;gap:20px;flex-wrap:wrap}.images img{width:224px;height:224px;object-fit:contain;background:#7c7468}figure{margin:8px 0}figcaption{font-size:14px;max-width:240px}.tag{background:#e8edf8;padding:4px 8px}small{overflow-wrap:anywhere}details{margin:12px 0}a{color:#1558b0}#cards{max-width:1200px}</style>
<header><b>E004 — 765 crop gốc + 5 mẫu bổ sung · Draft</b><p>Thứ tự nhãn: phone / looking. Khung cam = context gốc, xanh = context sửa; không phải person box. Bấm ảnh để mở kích thước gốc. Không có nhãn/split mới được tự nghiệm thu.</p>
<input id="query" placeholder="Tìm ID, anchor, ghi chú…"><select id="filter"><option value="all">Toàn bộ</option><option value="conflict">Khác nhãn owner</option><option value="recrop">Có crop sửa</option><option value="new">Mẫu mới</option><option value="keep">Shortlist đề xuất</option><option value="redundant">Gần trùng</option><option value="unknown">Có U</option><option value="withheld">Tạm giữ ngoài shortlist</option></select><span id="count"></span><p><button id="prev">← Trước</button><span id="page"></span><button id="next">Sau →</button></p></header><main id="cards"></main>
<script>const data=PAYLOAD;let page=0;const q=document.querySelector('#query'),f=document.querySelector('#filter');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let rows=data.filter(r=>JSON.stringify(r).toLowerCase().includes(q.value.toLowerCase())).filter(r=>f.value==='all'||f.value==='conflict'&&['draft_disagreement','conditional_owner_anchor_mismatch'].includes(r.comparison)||f.value==='recrop'&&r.replacement||f.value==='new'&&r.id.startsWith('CB-NEW')||f.value==='keep'&&r.selection==='proposed_shortlist'||f.value==='redundant'&&r.representative||f.value==='unknown'&&r.labels.includes('U')||f.value==='withheld'&&r.selection==='withheld_insufficient_evidence');let pages=Math.max(1,Math.ceil(rows.length/20));page=Math.max(0,Math.min(page,pages-1));document.querySelector('#count').textContent=rows.length+' mẫu';document.querySelector('#page').textContent=(page+1)+' / '+pages;
document.querySelector('#cards').innerHTML=rows.slice(page*20,(page+1)*20).map(r=>`<article id="${esc(r.id)}"><h2>${esc(r.id)} ${r.replacement?'→ '+esc(r.replacement):''}</h2><p>${esc(r.anchor)} · ${esc(r.parent)}</p><p>Owner: <b>${esc(r.owner)}</b> · Audit crop gốc: <b>${esc(r.old)}</b> · Đề xuất hiệu lực: <b>${esc(r.labels)}</b></p><p class="tag">${esc(r.comparison)} · ${esc(r.selection)} ${r.representative?'→ '+esc(r.representative):''}</p><div class="images"><figure><a href="${r.original}"><img loading="lazy" src="${r.original}"></a><figcaption>Crop gốc / mẫu mới</figcaption></figure>${r.derived?`<figure><a href="${r.derived}"><img loading="lazy" src="${r.preview}"></a><figcaption>Crop sửa · preview 224; bấm mở native</figcaption></figure>`:''}<figure><a href="${r.overlay}"><img loading="lazy" src="${r.overlay}"></a><figcaption>Frame đối chiếu khung · <a href="${r.source}">frame gốc</a></figcaption></figure></div><p>${esc(r.reason)}</p>${r.newReason?'<p>'+esc(r.newReason)+'</p>':''}<details><summary>Review nguyên văn và SHA</summary><p>${r.comments.map(esc).join('<br>')}</p><small>${esc(r.sha)}</small></details></article>`).join('');}
q.oninput=f.onchange=()=>{page=0;render()};document.querySelector('#prev').onclick=()=>{page--;render();scrollTo(0,0)};document.querySelector('#next').onclick=()=>{page++;render();scrollTo(0,0)};render();</script></html>
