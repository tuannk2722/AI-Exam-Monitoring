<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>V11 legacy audit R2 — Draft</title>
<style>body{font:16px system-ui;margin:24px;background:#eee;color:#222}header{position:sticky;top:0;background:white;padding:12px;z-index:1}article{background:white;padding:20px;margin:16px 0;border:1px solid #aaa}h2{font-size:19px}.images{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.images img{max-width:460px;max-height:460px;object-fit:contain}.images a:last-child img{width:224px;height:224px}input,select{font:inherit;padding:8px}article[hidden]{display:none}</style>
<header><h1>Audit R2 — 836 crop — Draft</h1><p>Đề xuất, chưa sửa V11. Nhãn hiển thị là quan sát trên crop hiện tại; recrop/exclude chưa có nhãn để enrollment. R1 được giữ để truy vết.</p>
<input id="query" placeholder="Tìm sample ID"><select id="action"><option value="">Mọi xử lý</option><option>keep</option><option>recrop</option><option>exclude</option></select> <span id="count"></span></header>
<!-- CARDS -->
<script>
const query=document.getElementById('query'), action=document.getElementById('action');
function filter(){let count=0;for(const card of document.querySelectorAll('article')){card.hidden=!(card.dataset.id.includes(query.value.toLowerCase().trim())&&(!action.value||card.dataset.action===action.value));if(!card.hidden)count++;}document.getElementById('count').textContent=count+' crop';}
query.addEventListener('input',filter);action.addEventListener('change',filter);filter();
</script></html>
