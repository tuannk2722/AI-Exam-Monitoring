  license: Apache-2.0
common:
  device: cuda
  precision: float32
  tf32: false
  xformers: disabled
  deterministic_algorithms: true
  workers: 0
  threads: 4
  batch_size: 16
  accumulation_steps: 1
  optimizer: AdamW
  head_learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 24
  warmup_head_only_epochs: 3
  patience: 6
  min_delta: 0.0001
  lr_scheduler: cosine
  min_lr_ratio: 0.1
  gradient_clipping: null
  pooling: global_mean
  feature_rule: concat_final_normalized_CLS_and_mean_patch_tokens
  head: {hidden_dim: 128, dropout: 0.3, output_dim: 2}
  loss:
    objective: balanced_smoothed_minibatch_bce_v3
    pos_weight_formula: sqrt_train_known_N_over_P
    pos_weight: [1.502307209641576, 1.7995527480124769]
    label_smoothing: 0.05
    unknown_mask: zero
    normalization: per_target_train_known_population_then_mean_over_two_targets
  sampling: uniform_permutation_without_replacement_each_epoch
  transform:
    name: rgb_letterbox_bilinear_v1
    fill: [124, 116, 104]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    brightness_jitter: 0.15
    contrast_jitter: 0.15
    saturation_jitter: 0.1
    box_jitter_ratio: 0.0
    random_erasing_prob: 0.0
arms:
  C0:
    encoder: dinov2_vits14
    image_size: 336
    feature_dim: 768
    train_last_blocks: 2
    train_final_norm: true
    backbone_learning_rate: 0.00001
    hypothesis: fresh_E008_G0_recipe_control_on_V15
  S448:
    same_as: C0
    image_size: 448
    hypothesis: retain_more_native_detail_before_patch_tokenization
  SL:
    same_as: C0
    backbone_learning_rate: 0.000003
    hypothesis: reduce_pretrained_feature_drift
  SH:
    same_as: C0
    backbone_learning_rate: 0.00003
    hypothesis: stronger_adaptation_to_new_training_examples
  S4:
    same_as: SL
    train_last_blocks: 4
    hypothesis: adapt_more_blocks_at_the_same_low_LR_as_SL
  B0:
    same_as: C0
    encoder: dinov2_vitb14
    feature_dim: 1536
    hypothesis: compare_larger_pretrained_representation_with_C0
  BL:
    same_as: B0
    backbone_learning_rate: 0.000003
    hypothesis: compare_larger_representation_with_SL_at_matched_low_LR
  B448:
    same_as: BL
    image_size: 448
    hypothesis: compare_higher_resolution_with_BL
profiles:
  full:
    selection_before_any_training_or_validation_scores: true
    minimum_reported_vram_gib: 40
    screening_arms: [C0, S448, SL, SH, S4, B0, BL, B448]
    smoke_arms: [C0, S4, B448]
    max_research_runs: 25
  core:
    selection_before_any_training_or_validation_scores: true
    minimum_reported_vram_gib: 14
    maximum_reported_vram_gib_exclusive: 40
    screening_arms: [C0, S448, SL, SH, S4]
    smoke_arms: [C0, S4, S448]
    max_research_runs: 19
  insufficient_gpu_policy: stop_without_CPU_fallback
  smoke_failure_policy: stop_without_switching_profile_or_variables
  minimum_private_drive_free_bytes_before_launch: 50000000000
screening:
  seeds: [20261106, 20261107]
  paired_seed_order: complete_all_arms_first_seed_then_all_arms_second_seed
  rank_over_two_seeds:
    - max_seeds_both_targets_pass
    - max_total_target_passes
    - min_mean_total_80_80_20_gate_shortfall
    - max_mean_macro_ap
    - min_mean_raw_masked_bce
    - min_encoder_parameter_count
    - min_image_size
    - arm_id_ascending
  finalists: top_two_distinct_recipes
  missing_metric_rank_values_only: {precision: 0.0, recall: 0.0, fpr: 1.0}
confirmation:
  additional_seeds: [20261108, 20261109, 20261110]
  arms: union_of_screening_top_two_and_C0
  reuse_finished_screening_runs_in_five_seed_summary: true
  no_new_variables_after_screening: true
selection:
  checkpoint: max_val_macro_ap_then_min_raw_masked_bce_then_earliest_epoch
  calibration: existing_exact_v4_val_once_after_checkpoint_selection
  score_grid: unique_validation_scores_plus_0_0.5_nextafter_1
  threshold_reuse: train_val_slices_bootstrap_reload
  support: {positive_min: 30, negative_min: 30, positive_groups_min: 5, negative_groups_min: 5}
  quality: {precision_min: 0.8, recall_min: 0.8, fpr_max: 0.2}
  five_seed_stability_target:
    both_targets_pass_seeds_min: 4
    purpose: proposed_research_candidate_criterion_not_independent_acceptance
  final_recipe_rank:
    - max_seeds_both_targets_pass_over_five
    - max_total_target_passes_over_five
    - min_mean_total_80_80_20_gate_shortfall
    - max_mean_macro_ap
    - min_mean_raw_masked_bce
    - min_encoder_parameter_count
    - min_image_size
    - arm_id_ascending
  checkpoint_handoff:
    prefer_seeds_passing_both_targets: true
    rule: lower_median_by_macro_AP_among_passing_seeds_then_seed_ascending
    if_no_seed_passes: research_only_no_automatic_candidate
    one_checkpoint_for_both_targets: true
  no_recalibration_after_results_review: true
  no_ensemble_or_TTA: true
