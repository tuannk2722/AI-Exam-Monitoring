    license_evidence: null  # Cần receipt cho exact source/weights.
    license_reported_by_upstream: Apache-2.0
    registers: false
    patch_size: 14
    features: normalized_cls_concat_mean_normalized_patch_tokens
    feature_dim: 768
common:
  device: cuda
  actual_gpu: null
  precision: float32
  automatic_cpu_fallback: false
  automatic_oom_config_changes: false
  workers: 0
  batch_size: 16
  sampling: uniform_permutation_no_drop_v1
  transform: rgb_letterbox_bilinear_v1
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  fill: [124, 116, 104]
  optimizer: AdamW
  head_learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 12
  warmup_head_only_epochs: 3
  lr_scheduler: cosine_after_head_warmup
  min_lr_ratio: 0.1
  patience: 6
  min_delta: 0.0001
  head:
    layers: [LayerNorm, Dropout, Linear, GELU, Dropout, Linear]
    hidden_dim: 128
    dropout: 0.3
    output_dim: 2
  loss:
    objective: global_known_normalized_weighted_smoothed_bce
    target_aggregation: equal_mean_two_targets
    unknown: masked_zero_gradient
    empty_target_minibatch: zero_contribution_with_population_known_denominator
    pos_weight_rule: sqrt_train_known_negative_over_positive
    train_positive: [342, 179]
    train_negative: [684, 931]
    pos_weight: [1.4142135623730951, 2.280595825313147]
    label_smoothing: 0.05
    smoothing_rule: symmetric_y_times_1_minus_epsilon_plus_epsilon_over_2
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    box_jitter_ratio: 0.0
    brightness_jitter: 0.15
    contrast_jitter: 0.15
    saturation_jitter: 0.1
    random_erasing_prob: 0.0
  checkpoint:
    unit: full_encoder_and_head
    primary_selection: max_val_macro_ap
    tie_breakers: [min_raw_val_masked_bce, earliest_epoch]
    resume: atomic_epoch_boundary_same_identity_and_environment
    splice_per_target_heads: false
  calibration:
    fit_on: val_only_after_checkpoint_selection
    apply_same_pair_to: [train, val, slices, standalone_evaluation]
    candidates: exact_score_breakpoints_with_explicit_endpoint_policy
    comparison: score_greater_than_or_equal_threshold
    no_positive_prediction_precision: null
    feasible_rank: [max_f1, max_minimum_gate_margin, nearest_0_5, lowest_threshold]
    fallback_rank: [min_total_gate_shortfall, max_f1, nearest_0_5, lowest_threshold]
arms:
  R0:
    encoder: resnet18
    image_size: 224
    feature_dim: 512
    trainable_scope: head_and_layer4_block1
    backbone_learning_rate: 0.00003
    batchnorm_policy: all_eval_affine_follows_trainable_scope
    random_erasing_prob: 0.15
  R1:
    same_as: R0
    random_erasing_prob: 0.0
  R2:
    same_as: R1
    image_size: 336
  D0:
    encoder: dinov2_vits14
    image_size: 336
    feature_dim: 768
    trainable_scope: head_only
    backbone_learning_rate: 0.0
    stochastic_depth: 0.0
    random_erasing_prob: 0.0
