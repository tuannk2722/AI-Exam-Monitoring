pretrained_candidates:
  resnet18:
    weights_id: IMAGENET1K_V1
    local_path: outputs/pretrained/resnet18-f37072fd.pth
    sha256: f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec
    license_evidence: artifacts/reports/E004-v9-execution-20261013/pretrained-license.json
  dinov2_vits14:
